[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-data-pipeline"
version = "0.2.0"
description = "Streaming retail orders pipeline: Kafka ingestion with versioned contracts, incremental medallion lakehouse on Parquet + DuckDB, and data quality gates with metrics."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pragathi Gopal" }]
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.0",
  "pyarrow>=15",
  "pydantic>=2.5",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
retail-pipeline = "retail_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_pipeline = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
